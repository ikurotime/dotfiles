console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[palette]
  black = '#262B44'
  blue = '#4B95E9'
  green = '#59C9A5'
  orange = '#F07623'
  red = '#D81E5B'
  white = '#E0DEF4'
  yellow = '#F3AE35'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

    [[blocks.segments]]
    type = "path"
    style = "plain"
    background= "transparent"
    foreground = "blue"
    template = '{{ .Path }}'

    [blocks.segments.properties]
        style = "full"
    
    [[blocks.segments]]
        type = "git"
        style = "plain"
        background = "transparent"
        foreground = "#6c6c6c"
        template = " {{ .HEAD}}{{ if or (.Working.Changed) (.Staged.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}↓{{ .Behind }}{{ end }}{{ if gt .Ahead 0 }}↑{{ .Ahead }}{{ end }}</> "
    [blocks.segments.properties]
        branch_icon = ""
        commit_icon = "@"
        fetch_status = true

[[blocks]]
  type = "rprompt"
  overflow = "hidden"
    [[blocks.segments]]
    type = "executiontime"
    style = "plain"
    foreground = "yellow"
    background = "transparent"
    template = "{{ .FormattedMs}}"
    [blocks.segments.properties]
        threshold = 5000
        style = ''

[[blocks]]
 type = "prompt"
 alignment = 'left'
 newline = true
        
    [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground_templates = [
        "{{if gt .Code 0}}red{{end}}",
        "{{if eq .Code 0}}magenta{{end}}"
    ]
    foreground = "magenta"
    background = "transparent"
    template = "❯"

[transient_prompt]
    foreground = "magenta"
    background = "transparent"
    template = "❯ "
    newline = true
    foreground_templates = [
        "{{if gt .Code 0}}red{{end}}",
        "{{if eq .Code 0}}magenta{{end}}"
    ]


